# nginx site for zabandan.shaykas.com, serving the built site straight from the git checkout.
# Install: sudo cp deploy/nginx-zabandan.conf /etc/nginx/sites-available/zabandan
#          sudo ln -s /etc/nginx/sites-available/zabandan /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Adjust `root` if the repo isn't cloned to /var/www/zabandan. If shaykas.com's server block
# has an HTTPS listener (for Cloudflare's "Full" SSL mode), copy its listen/ssl lines here.
server {
    listen 80;
    listen [::]:80;
    server_name zabandan.shaykas.com;

    root /var/www/zabandan/site;
    index index.html;

    # /poem/ serves /poem/index.html; anything else that doesn't exist gets the 404 page
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # Asset URLs carry a content hash (?v=...), so they can be cached for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Don't serve git metadata if the root is ever pointed at the repo itself
    location ~ /\.git { deny all; }
}
