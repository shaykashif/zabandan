<style>
/* Layout: one reading column. Each couplet's Urdu sits in a gold double rule like a manuscript
   jadval; translations and the word panel follow. A nazm groups couplets into stanzas. */
:root {
  --paper: #eff2f7;
  --panel: #ffffff;
  --ink: #1a2133;
  --muted: #586179;
  --rule: #cbd1dd;
  --lapis: #2b4899;
  --gold: #a7781c;
  --hl: rgba(43, 72, 153, 0.13);
  --hl-soft: rgba(167, 120, 28, 0.14);

  --f-urdu: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Urdu Typesetting", "Noto Naskh Arabic", serif;
  --f-text: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;

  --s-1: 0.8125rem;
  --s0: 1.0625rem;
  --s1: 1.25rem;
  --s2: 1.6rem;
  --s3: clamp(1.9rem, 5vw, 2.6rem);
  --urdu: clamp(1.05rem, 4.4vw, 2.05rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1220; --panel: #141a2a; --ink: #e4e7ef; --muted: #98a1b6; --rule: #2a3349;
    --lapis: #9fb3f3; --gold: #d3a74b; --hl: rgba(159, 179, 243, 0.17); --hl-soft: rgba(211, 167, 75, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1220; --panel: #141a2a; --ink: #e4e7ef; --muted: #98a1b6; --rule: #2a3349;
  --lapis: #9fb3f3; --gold: #d3a74b; --hl: rgba(159, 179, 243, 0.17); --hl-soft: rgba(211, 167, 75, 0.16);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-text);
  font-size: var(--s0);
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 1.5rem 4rem;
}
.wrap { max-width: 46rem; margin: 0 auto; display: grid; gap: 2rem; }
.stack { display: grid; gap: 3rem; }

.site { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; }
.brand { font-family: var(--f-ui); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-size: var(--s-1); color: var(--muted); }
.brand .ur { font-family: var(--f-urdu); font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 1rem; color: var(--lapis); margin-inline-start: 0.4rem; }
.poems { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.poem-tab {
  font: inherit; font-family: var(--f-text); font-size: var(--s0); color: var(--ink); background: none;
  border: 0; border-bottom: 2px solid transparent; padding: 0.2rem 0.1rem; cursor: pointer;
}
.poem-tab small { font-family: var(--f-ui); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-inline-start: 0.35rem; }
.poem-tab[aria-selected="true"] { border-bottom-color: var(--gold); }

header { display: grid; gap: 0.9rem; }
.eyebrow { font-family: var(--f-ui); font-size: var(--s-1); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-weight: 400; font-style: italic; font-size: var(--s3); line-height: 1.15; text-wrap: balance; }
h1::first-letter { text-transform: uppercase; }
h1 .en { font-style: normal; color: var(--muted); font-size: 0.6em; display: block; margin-top: 0.3rem; }
.h1-urdu { font-family: var(--f-urdu); font-size: var(--s1); line-height: 2.2; color: var(--lapis); margin: 0; }
.summary { margin: 0; max-width: 62ch; }
.meta { display: grid; gap: 0.35rem; font-family: var(--f-ui); font-size: var(--s-1); color: var(--muted); max-width: 62ch; }
.meta p { margin: 0; }
.meta b { font-weight: 600; color: var(--ink); }
.meta .ur { font-family: var(--f-urdu); font-size: 1rem; color: var(--lapis); }
.turns { margin: 0; padding-inline-start: 1.1rem; display: grid; gap: 0.3rem; max-width: 62ch; }

.controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem;
  font-family: var(--f-ui); font-size: var(--s-1);
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
  background: var(--paper); padding-block: 0.6rem; border-bottom: 1px solid var(--rule);
}
.controls .hint { color: var(--muted); margin-inline-end: auto; }
.seg-ctl { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; background: var(--panel); }
.seg-ctl button { font: inherit; color: var(--ink); background: none; border: 0; padding: 0.3rem 0.8rem; cursor: pointer; }
.seg-ctl button + button { border-inline-start: 1px solid var(--rule); }
.seg-ctl button[aria-pressed="true"] { background: var(--hl); color: var(--lapis); }
.toggle { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 999px; padding: 0.3rem 0.8rem; cursor: pointer; }
.toggle[aria-pressed="true"] { border-color: var(--lapis); color: var(--lapis); background: var(--hl); }
button:focus-visible, .seg:focus-visible, summary:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }

.stanza { display: grid; gap: 1.5rem; }
.st-head { display: grid; gap: 0.25rem; border-top: 1px solid var(--gold); padding-top: 0.75rem; }
.st-head h2 { margin: 0; font-family: var(--f-ui); font-size: var(--s-1); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
.st-head p { margin: 0; font-style: italic; color: var(--muted); max-width: 62ch; }

.couplet { display: grid; gap: 1rem; }
.c-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.75rem; font-family: var(--f-ui); font-size: var(--s-1); color: var(--muted); }
.c-num { font-family: var(--f-text); font-size: var(--s1); color: var(--gold); font-variant-numeric: tabular-nums; }
.c-tag { letter-spacing: 0.06em; text-transform: uppercase; }
.c-role { font-family: var(--f-text); font-style: italic; font-size: var(--s0); color: var(--muted); }

.verse {
  background: var(--panel); border: 1px solid var(--gold); outline: 1px solid var(--gold); outline-offset: 3px;
  margin: 4px; padding: 1rem clamp(0.75rem, 3vw, 1.5rem); display: grid; gap: 0.35rem;
}
.line-ur { direction: rtl; font-family: var(--f-urdu); font-size: var(--urdu); line-height: 2.35; text-align: center; margin: 0; }
.u { font: inherit; color: inherit; background: none; border: 0; padding: 0 0.08em; border-radius: 4px; cursor: pointer; line-height: inherit; }
.u:hover { background: var(--hl); }
.u.in-phrase { text-decoration: underline dotted var(--gold); text-underline-offset: 0.55em; text-decoration-thickness: 1.5px; }
.u.sel { background: var(--hl); color: var(--lapis); }
.u.rel { background: var(--hl-soft); }
.line-roman { margin: 0 0 0.4rem; text-align: center; font-style: italic; color: var(--muted); }

.panel { border-inline-start: 3px solid var(--lapis); background: var(--panel); padding: 0.9rem 1rem; display: grid; gap: 0.5rem; position: relative; }
.panel-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.35rem 0.9rem; padding-inline-end: 2rem; }
.p-ur { font-family: var(--f-urdu); font-size: var(--s2); line-height: 2; color: var(--lapis); direction: rtl; }
.p-roman { font-style: italic; font-size: var(--s1); }
.chip { font-family: var(--f-ui); font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid var(--rule); border-radius: 999px; padding: 0.05rem 0.55rem; color: var(--muted); }
.p-gloss { font-size: var(--s1); margin: 0; }
.p-base { margin: 0; font-family: var(--f-ui); font-size: var(--s-1); color: var(--muted); }
.p-phrase { margin: 0; padding: 0.5rem 0.75rem; background: var(--hl-soft); border-radius: 6px; }
.p-phrase .ur { font-family: var(--f-urdu); }
.close { position: absolute; top: 0.5rem; inset-inline-end: 0.5rem; width: 2rem; height: 2rem; font: 600 1.1rem/1 var(--f-ui); color: var(--muted); background: none; border: 0; border-radius: 6px; cursor: pointer; }
.close:hover { background: var(--hl); }

.tr { display: grid; gap: 0.25rem; }
.tr-label { font-family: var(--f-ui); font-size: var(--s-1); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tr p { margin: 0; }
.poetic p { font-size: var(--s1); line-height: 1.5; }
.seg { border-radius: 3px; cursor: pointer; }
.seg.linked:hover { background: var(--hl); }
.seg.sel { background: var(--hl); color: var(--lapis); }
.seg.rel { background: var(--hl-soft); }

details { font-size: var(--s0); }
summary { font-family: var(--f-ui); font-size: var(--s-1); color: var(--lapis); cursor: pointer; width: fit-content; }
details ul { margin: 0.5rem 0 0; padding-inline-start: 1.1rem; display: grid; gap: 0.4rem; max-width: 62ch; }

body.no-roman .line-roman, body.no-literal .literal, body.no-notes .notes { display: none; }

footer { font-family: var(--f-ui); font-size: var(--s-1); color: var(--muted); border-top: 1px solid var(--rule); padding-top: 1rem; display: grid; gap: 0.4rem; max-width: 62ch; }
footer p { margin: 0; }

@media (prefers-reduced-motion: no-preference) { .u, .seg { transition: background-color 120ms ease, color 120ms ease; } }
</style>

<div class="wrap">
  <div class="site">
    <span class="brand">Zabandan<span class="ur" lang="ur">زباندان</span></span>

    <button class="toggle" id="t-notes" aria-pressed="true">Notes</button>
  </div>

  <main id="body" class="stack"></main>

  <footer id="footer"></footer>
</div>

ife.", "gardan par rahegā carries the idiomatic sense of guilt or a blood-debt being held against someone.", "chashm-e-tar is a Persian-style compound meaning wet or weeping eyes.", "dam-ba-dam, literally breath by breath, intensifies the refrain nikle: the tears or blood issue constantly, moment after moment."]}, {"stanza": 2, "first_line": 0, "ur": ["نکلنا خلد سے آدم کا سنتے آئے ہیں لیکن", "بہت بے آبرو ہو کر ترے کوچے سے ہم نکلے"], "roman": ["nikalnā ḳhuld se aadam kā sunte aa.e haiñ lekin", "bahut be-ābrū ho kar tire kūche se ham nikle"], "is_matla": false, "is_maqta": false, "index": 2, "words": [["نکلنا", "خلد", "سے", "آدم", "کا", "سنتے", "آئے", "ہیں", "لیکن"], ["بہت", "بے", "آبرو", "ہو", "کر", "ترے", "کوچے", "سے", "ہم", "نکلے"]], "units": [{"id": "u1", "line": 0, "start": 0, "end": 0, "roman": "nikalnā", "kind": "word", "gloss": "going out, emerging", "base": "to come out", "ur": "نکلنا"}, {"id": "u2", "line": 0, "start": 1, "end": 1, "roman": "ḳhuld", "kind": "word", "gloss": "Paradise, the garden from which Adam was expelled", "base": "Paradise", "ur": "خلد"}, {"id": "u3", "line": 0, "start": 2, "end": 2, "roman": "se", "kind": "particle", "gloss": "from", "base": "", "ur": "سے"}, {"id": "u4", "line": 0, "start": 3, "end": 3, "roman": "aadam", "kind": "name", "gloss": "Adam, the first human", "base": "", "ur": "آدم"}, {"id": "u5", "line": 0, "start": 4, "end": 4, "roman": "kā", "kind": "particle", "gloss": "of", "base": "", "ur": "کا"}, {"id": "u6", "line": 0, "start": 5, "end": 5, "roman": "sunte", "kind": "word", "gloss": "hearing", "base": "hearing", "ur": "سنتے"}, {"id": "u7", "line": 0, "start": 6, "end": 6, "roman": "aa.e", "kind": "word", "gloss": "have come; marks habitual past", "base": "came", "ur": "آئے"}, {"id": "u8", "line": 0, "start": 7, "end": 7, "roman": "haiñ", "kind": "particle", "gloss": "are; present auxiliary", "base": "", "ur": "ہیں"}, {"id": "u9", "line": 0, "start": 8, "end": 8, "roman": "lekin", "kind": "particle", "gloss": "but", "base": "", "ur": "لیکن"}, {"id": "u10", "line": 1, "start": 0, "end": 0, "roman": "bahut", "kind": "word", "gloss": "utterly, very much", "base": "much", "ur": "بہت"}, {"id": "u11", "line": 1, "start": 1, "end": 2, "roman": "be-ābrū", "kind": "compound", "gloss": "dishonoured, deprived of honour", "base": "dishonoured", "ur": "بے آبرو"}, {"id": "u12", "line": 1, "start": 3, "end": 4, "roman": "ho kar", "kind": "compound", "gloss": "having become", "base": "", "ur": "ہو کر"}, {"id": "u13", "line": 1, "start": 5, "end": 5, "roman": "tire", "kind": "word", "gloss": "your (intimate form, for beloved)", "base": "your", "ur": "ترے"}, {"id": "u14", "line": 1, "start": 6, "end": 6, "roman": "kūche", "kind": "word", "gloss": "lane, street", "base": "lane", "ur": "کوچے"}, {"id": "u15", "line": 1, "start": 7, "end": 7, "roman": "se", "kind": "particle", "gloss": "from", "base": "", "ur": "سے"}, {"id": "u16", "line": 1, "start": 8, "end": 8, "roman": "ham", "kind": "word", "gloss": "we/I (lyric self)", "base": "we", "ur": "ہم"}, {"id": "u17", "line": 1, "start": 9, "end": 9, "roman": "nikle", "kind": "word", "gloss": "came out, emerged", "base": "came out", "ur": "نکلے"}], "phrases": [{"id": "p1", "units": ["u6", "u7", "u8"], "gloss": "we have always heard; it has come down to us by tradition"}], "literal": [[{"text": "The going out", "units": ["u1"]}, {"text": "of Adam from Paradise", "units": ["u4", "u5", "u2", "u3"]}, {"text": "we have always heard,", "units": ["u6", "u7", "u8"]}, {"text": "but", "units": ["u9"]}], [{"text": "Having become", "units": ["u12"]}, {"text": "utterly", "units": ["u10"]}, {"text": "dishonoured,", "units": ["u11"]}, {"text": "from your lane", "units": ["u13", "u14", "u15"]}, {"text": "we came out.", "units": ["u16", "u17"]}]], "poetic": ["We have always heard the tale of Adam's going out from Paradise—", "but from your lane I came out utterly dishonoured."], "notes": ["The phrase khuld se aadam kā nikalnā refers to the Quranic/Islamic story of Adam's expulsion from Paradise.", "sunte aa.e haiñ is an idiom meaning 'we have heard from old' or 'tradition tells us', not literally 'we have come hearing'.", "ābrū literally means the water or brightness of the face, hence honour; be-ābrū means stripped of face/honour, disgraced.", "The beloved's kūcha is placed above Paradise: leaving it in disgrace is treated as a fall greater than Adam's.", "The refrain nikalnā/nikle links Adam's expulsion to the lover's departure, both being an emergence from grace into loss."]}, {"stanza": 3, "first_line": 0, "ur": ["بھرم کھل جائے ظالم تیرے قامت کی درازی کا", "اگر اس طرۂ پر پیچ و خم کا پیچ و خم نکلے"], "roman": ["bharam khul jaa.e zālim tere qāmat kī darāzī kā", "agar is turra-e-pur-pech-o-ḳham kā pech-o-ḳham nikle"], "is_matla": false, "is_maqta": false, "index": 3, "words": [["بھرم", "کھل", "جائے", "ظالم", "تیرے", "قامت", "کی", "درازی", "کا"], ["اگر", "اس", "طرۂ", "پر", "پیچ", "و", "خم", "کا", "پیچ", "و", "خم", "نکلے"]], "units": [{"id": "u1", "line": 0, "start": 0, "end": 0, "roman": "bharam", "kind": "word", "gloss": "illusion, deception, secret", "base": "illusion, regard, secrecy", "ur": "بھرم"}, {"id": "u2", "line": 0, "start": 1, "end": 1, "roman": "khul", "kind": "word", "gloss": "open, become revealed", "base": "open", "ur": "کھل"}, {"id": "u3", "line": 0, "start": 2, "end": 2, "roman": "jaa.e", "kind": "word", "gloss": "may become", "base": "may go", "ur": "جائے"}, {"id": "u4", "line": 0, "start": 3, "end": 3, "roman": "zālim", "kind": "word", "gloss": "O cruel one, O tyrant", "base": "cruel one, tyrant", "ur": "ظالم"}, {"id": "u5", "line": 0, "start": 4, "end": 4, "roman": "tere", "kind": "word", "gloss": "your", "base": "your", "ur": "تیرے"}, {"id": "u6", "line": 0, "start": 5, "end": 5, "roman": "qāmat", "kind": "word", "gloss": "stature, height", "base": "stature", "ur": "قامت"}, {"id": "u7", "line": 0, "start": 6, "end": 6, "roman": "kī", "kind": "particle", "gloss": "of", "base": "feminine genitive marker", "ur": ls of this curl-laden tress were straightened out."], "notes": ["The idiom 'bharam khulnā' means to have one's illusion, secret, or deception exposed.", "The beloved's tall stature (qāmat kī darāzī) is a standard image of beauty, here treated as a false impression created by the curled tress.", "The compound 'turra-e-pur-pech-o-kham' already contains the word 'pech-o-kham', so the line literally repeats the idea: the twist of a tress full of twist.", "The refrain word 'nikle' here carries the sense of being straightened or released, not merely emerging.", "'zālim' is vocative: the lover addresses the beloved as a beautiful but cruel tyrant."]}, {"stanza": 4, "first_line": 0, "ur": ["مگر لکھوائے کوئی اس کو خط تو ہم سے لکھوائے", "ہوئی صبح اور گھر سے کان پر رکھ کر قلم نکلے"], "roman": ["magar likhvā.e koī us ko ḳhat to ham se likhvā.e", "huī sub.h aur ghar se kaan par rakh kar qalam nikle"], "is_matla": false, "is_maqta": false, "index": 4, "words": [["مگر", "لکھوائے", "کوئی", "اس", "کو", "خط", "تو", "ہم", "سے", "لکھوائے"], ["ہوئی", "صبح", "اور", "گھر", "سے", "کان", "پر", "رکھ", "کر", "قلم", "نکلے"]], "units": [{"id": "u1", "line": 0, "start": 0, "end": 0, "roman": "magar", "kind": "word", "gloss": "but", "base": "", "ur": "مگر"}, {"id": "u2", "line": 0, "start": 1, "end": 1, "roman": "likhvā.e", "kind": "word", "gloss": "should have someone write", "base": "causative of likhna", "ur": "لکھوائے"}, {"id": "u3", "line": 0, "start": 2, "end": 2, "roman": "koī", "kind": "word", "gloss": "someone", "base": "", "ur": "کوئی"}, {"id": "u4", "line": 0, "start": 3, "end": 3, "roman": "us", "kind": "word", "gloss": "him/her", "base": "that/he/she/it", "ur": "اس"}, {"id": "u5", "line": 0, "start": 4, "end": 4, "roman": "ko", "kind": "particle", "gloss": "to", "base": "object marker", "ur": "کو"}, {"id": "u6", "line": 0, "start": 5, "end": 5, "roman": "ḳhat", "kind": "word", "gloss": "letter", "base": "letter; line; down", "ur": "خط"}, {"id": "u7", "line": 0, "start": 6, "end": 6,  ["u0", "u6"], "gloss": "idiom expressing a vast difference or incompatibility"}], "literal": [[{"text": "Where", "units": ["u0"]}, {"text": "the tavern's", "units": ["u1", "u2"]}, {"text": "door", "units": ["u3"]}, {"text": "Ghalib", "units": ["u4"]}, {"text": "and", "units": ["u5"]}, {"text": "where", "units": ["u6"]}, {"text": "the preacher", "units": ["u7"]}], [{"text": "But", "units": ["u8"]}, {"text": "this much", "units": ["u9"]}, {"text": "I know", "units": ["u10", "u11"]}, {"text": "yesterday", "units": ["u12"]}, {"text": "he", "units": ["u13"]}, {"text": "was going", "units": ["u14", "u15"]}, {"text": "that", "units": ["u16"]}, {"text": "I", "units": ["u17"]}, {"text": "left", "units": ["u18"]}]], "poetic": ["How far the tavern door, Ghalib, from the preacher's way!", "Yet I know this: as I stepped out, he was stepping in."], "notes": ["The phrase 'kahāñ... aur kahāñ' emphasizes the perceived moral and social distance between the tavern and the preacher.", "Ghalib uses irony to expose the hypocrisy of the religious establishment, suggesting the preacher secretly visits the tavern.", "The tavern (mai-ḳhāna) symbolizes a space of spiritual freedom, rebellion, or forbidden pleasure.", "The word 'nikle' (left/emerged) serves as the radif, linking this couplet to the theme of exile and departure throughout the ghazal."]}]}}}, {"id": "parinde-ki-faryad", "form": "nazm", "poet": "Allama Iqbal", "title_ur": "پرندے کی فریاد", "title_roman": "Parinde kī Faryād", "title_en": "The Bird's Lament", "collection": "Bāng-e-Darā (1924)", "source": "Urdu Wikisource, https://ur.wikisource.org/wiki/پر_ندے_کی_فریاد (tagged PD-Pakistan)", "text_notes": "Corrected one Wikisource typo, قفسں to قفس (stanza 2, line 6). Diacritics kept as in the source.\n", "stanza_lengths": [10, 6, 6], "title_short": "Parinde kī Faryād", "variants": {"deepseek-v4-pro": {"model": "deepseek/deepseek-v4-pro-0813", "overview": {"summary": "A caged bird remembers the lost freedom and beauty of its garden, nest, and beloved companion. It contrasts that past with its present dark cage, where it fears dying of grief. Finally it asks listeners not to mistake its cry for a song and begs the captor to set it free.", "speaker": "The speaker is a captive bird in a cage, addressing its own memory, God, human listeners, and finally the captor.", "form": "The poem is a three-stanza nazm with unequal stanza lengths of 10, 6, and 6 lines; its rhyme is stanzaic rather than a single ghazal radif, using recurring end-rhymes such as -ānā in stanza 1, -ūñ/-āūñ in stanza 2, and -ai/-āle in stanza 3.", "stanzas": [{"stanza": 1, "role": "This stanza establishes the remembered past of garden, nest, freedom, and the beloved, and contrasts it with the cage and the impossible wish for release."}, {"stanza": 2, "role": "This stanza shifts to the present misery of captivity, describing the bird's longing for home, the spring outside, and its complaint to God and fear of death."}, {"stanza": 3, "role": "This stanza turns the personal lament into a universal cry of wounded hearts, warns listeners not to hear it as mere song, and makes a direct appeal to the captor for freedom."}], "turns": ["Stanza 1, line 1: opening turn into nostalgic memory of the past.", "Stanza 1, lines 5–6: the memory turns painful, as remembered beauty now wounds the heart.", "Stanza 1, lines 9–10: shift from remembered freedom and the beloved to the present cage and the wish for release.", "Stanza 2, line 1: shift to explicit present suffering and self-description as unfortunate.", "Stanza 2, line 5: direct address to God with the complaint of captivity and fear of death.", "Stanza 3, lines 3–4: shift from personal complaint to addressing listeners and redefining the song as a lament.", "Stanza 3, lines 5–6: final direct appeal to the captor, asking for freedom as a source of blessing."], "readings": "Beyond the literal caged bird, the poem is often read as an allegory of the human soul trapped in material existence or of a colonized people longing for political and spiritual freedom. The final plea to the captor to earn a blessing by releasing the prisoner gives the poem a moral and spiritual edge."}, "blocks": [{"stanza": 0, "first_line": 0, "ur": ["آتا ہے یاد مجھ کو گزرا ہوا زمانا", "وہ باغ کی بہاریں، وہ سب کا چہچہانا"], "roman": ["ātā hai yād mujh ko guzrā huā zamāna", "vo bāġh kī bahāreñ vo sab kā chahchahānā"], "index": 0, "words": [["آتا", "ہے", "یاد", "مجھ", "کو", "گزرا", "ہوا", "زمانا"], ["وہ", "باغ", "کی", "بہاریں،", "وہ", "سب", "کا", "چہچہانا"]], "units": [{"id": "u1", "line": 0, "start": 0, "end": 0, "roman": "ātā", "kind": "word", "gloss": "comes", "base": "", "ur": "آتا"}, {"id": "u2", "line": 0, "start": 1, "end": 1, "roman": "hai", "kind": "word", "gloss": "is (auxiliary verb)", "base": "", "ur": "ہے"}, {"id": "u3", "line": 0, "start": 2, "end": 2, "roman": "yād", "kind": "word", "gloss": "memory; remembrance", "base": "", "ur": "یاد"}, {"id": "u4", "line": 0, "start": 3, "end": 3, "roman": "mujh", "kind": "word", "gloss": "me; to me", "base": "oblique of maiñ", "ur": "مجھ"}, {"id": "u5", "line": 0, "start": 4, "end": 4, "roman": "ko", "kind": "particle", "gloss": "to (object marker)", "base": "", "ur": "کو"}, {"id": "u6", "line": 0, "start": 5, "end": 5, "roman": "guzrā", "kind": "word", "gloss": "passed; elapsed", "base": "guzarnā", "ur": "گزرا"}, {"id": "u7", "line": 0, "start": 6, "end": 6, "roman": "huā", "kind": "word", "gloss": "become; been (marks completed state)", "base": "honā", "ur": "ہوا"}, {"id": "u8", "line": 0, "start": 7, "end": 7, "roman": "zamāna", "kind": "word", "gloss": "time; age; era", "base": "", "ur": "زمانا"}, {"id": "u9", "line": 1, "start": 0, "end": 0, "roman": "vo", "kind": "word", "gloss": "those", "base": "that/those", "ur": "وہ"}, {"id": "u10", "line": 1, "start": 1, "end": 1, "roman": "bāġh", "kind": "word", "gloss": "garden", "base": "", "ur": "باغ"}, {"id": "u11", "line": 1, "start": 2, "end": 2, "roman": "kī", "kind": "particle", "gloss": "of (feminine/plural linking particle)", "base": "", "ur": "کی"}, {"id": "u12", "line": 1, "start": 3, "end": 3, "roman": "bahāreñ", "kind": "word", "gloss": "springtimes; blooms; glories", "base": "bahār", "ur": "بہاریں،"}, {"id": "u13", "line": 1, "start": 4, "end": 4, "roman": "vo", "kind": "word", "gloss": "that", "base": "that/those", "ur": "وہ"}, {"id": "u14", "line": 1, "start": 5, "end": 5, "roman": "sab", "kind": "word", "gloss": "all; everyone", "base": "", "ur": "سب"}, {"id": "u15", "line": 1, "start": 6, "end": 6, "roman": "kā", "kind": "particle", "gloss": "of (masculine/oblique linking particle)", "base": "", "ur": "کا"}, {"id": "u16", "line": 1, "start": 7, "end": 7, "roman": "chahchahānā", "kind": "word", "gloss": "chirping; twittering; chatter", "base": "", "ur": "چہچہانا"}], "phrases": [{"id": "p1", "units": ["u1", "u3"], "gloss": "yād ānā: comes to memory; is remembered"}], "literal": [[{"text": "The", "units": []}, {"text": "bygone", "units": ["u6", "u7"]}, {"text": "age", "units": ["u8"]}, {"text": "comes", "units": ["u1", "u2"]}, {"text": "to me", "units": ["u4", "u5"]}, {"text": "as memory", "units": ["u3"]}], [{"text": "Those", "units": ["u9"]}, {"text": "springtimes", "units": ["u12"]}, {"text": "of the", "units": ["u11"]}, {"text": "garden,", "units": ["u10"]}, {"text": "that", "units": ["u13"]}, {"text": "all's", "units": ["u14", "u15"]}, {"text": "chirping", "units": ["u16"]}]], "poetic": ["I remember the bygone age—", "the garden’s springtimes, the chirping of all."], "notes": ["yād ānā is an idiom meaning to come to mind or be remembered; the remembered thing is the grammatical subject.", "guzrā huā zamāna stresses an age that has passed away and cannot return.", "bahāreñ, plural of bahār, means springtimes but also connotes bloom, beauty, and vitality.", "sab kā chahchahānā evokes a whole garden alive with birdsong, contrasting with the cage later in the poem.", "The pairing of visual bloom and audible chirping builds a fu <script>
(function () {

    b.dataset.id = p.id;
    b.append(p.title_short, el("small", null, p.form));

    tabs.append(b);

    var b = el("button", null, m.label);

    b.dataset.name = m.name;

    var v = poem.variants[state.model] || poem.variants[Object.keys(poem.variants)[0]];
    var ov = v.overview || {};
    Array.from(tabs.children).forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.id === poem.id)); });
    Array.from(mctl.children).forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.name === state.model)); });

    // Header
    var head = document.getElementById("head");
    head.textContent = "";
    var nSt = poem.stanza_lengths.length;
    var bits = [poem.poet, poem.form === "nazm" ? "Nazm" : "Ghazal"];
    if (poem.collection) bits.push(poem.collection);
    bits.push(poem.form === "nazm" ? nSt + " stanzas, " + poem.stanza_lengths.reduce(function (a, b) { return a + b; }, 0) + " lines" : v.blocks.length + " couplets");
    head.append(el("div", "eyebrow", bits.join(" · ")));
    var h1 = el("h1", null, poem.title_roman);
    if (poem.title_en) h1.append(el("span", "en", poem.title_en));
    head.append(h1);
    var hu = el("p", "h1-urdu", poem.title_ur); hu.lang = "ur"; hu.dir = "rtl";
    head.append(hu);

    var meta = el("div", "meta");
    if (poem.form === "ghazal") {
      if (ov.radif) {
        var r = el("p");
        r.append(el("b", null, "Radif (refrain): "), el("span", "ur", ov.radif.ur), " " + ov.radif.roman + ", “" + ov.radif.en + "”, ends every second line.");
        meta.append(r);

      if (ov.qafiya && ov.qafiya.length) {
        var q = el("p");
        q.append(el("b", null, "Qafiya (rhyme): "), Array.from(new Set(ov.qafiya)).join(", "));
        meta.append(q);

    var panel = el("div", "panel");

    panel.setAttribute("role", "region");
    panel.setAttribute("aria-live", "polite");

        var sp = el("span", "seg", s.text);
        var us = s.units || [];

          sp.classList.add("linked");
          sp.tabIndex = 0;

          sp.addEventListener("click", go);

      lit.append(p);
    });

      c.notes.forEach(function (n) { ul.append(el("li", null, n)); });

    function clear() {

      ps.forEach(function (p) { p.units.forEach(function (x) { if (x !== id) related[x] = true; }); });

      segs.forEach(function (s) {
        if (s.units.indexOf(id) >= 0) s.el.classList.add("sel");
        else if (s.units.some(function (x) { return related[x]; })) s.el.classList.add("rel");

      var pu = el("span", "p-ur", u.ur); pu.lang = "ur";
      top.append(pu, el("span", "p-roman", u.roman));
      if (u.kind && u.kind !== "word") top.append(el("span", "chip", u.kind));
      panel.append(top, el("p", "p-gloss", u.gloss));
      if (u.base) panel.append(el("p", "p-base", "Usual sense: " + u.base));
      ps.forEach(function (p) {
        var box = el("p", "p-phrase");
        var words = p.units.map(function (x) { return units[x]; }).filter(Boolean)
          .sort(function (a, b) { return a.line - b.line || a.start - b.start; });
        var ur = el("span", "ur", words.map(function (w) { return w.ur; }).join(" … "));
        ur.lang = "ur";
        box.append("Part of the expression ", ur, " (" + words.map(function (w) { return w.roman; }).join(" … ") + "): " + p.gloss);
        panel.append(box);
      });
      var x = el("button", "close", "×");
      x.type = "button";
      x.setAttribute("aria-label", "Close word meaning");
      x.addEventListener("click", function () { close(); btns[id].focus(); });
      panel.append(x);
      panel.hidden = false;
      state.close = close;
    }
    return sec;
  }

  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && state.close) state.close(); });

  [["t-roman", "no-roman"], ["t-literal", "no-literal"], ["t-notes", "no-notes"]].forEach(function (pair) {
    var b = document.getElementById(pair[0]), key = "zabandan." + pair[1];
    var off = store(key) === "1";
    function apply() { document.body.classList.toggle(pair[1], off); b.setAttribute("aria-pressed", String(!off)); }
    b.addEventListener("click", function () { off = !off; apply(); store(key, off ? "1" : "0"); });
    apply();
  });

  render();
})();
</script>
